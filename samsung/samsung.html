<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoki Lee - Samsung</title>
    <link rel="stylesheet" href="samsung-style.css" />
  </head>
  <body>
    <div class="back-button-container">
      <a href="../main/index.html" class="back-button">← 메인으로 돌아가기</a>
    </div>
    <header>
      <h1 class="title">삼성자동차</h1>
    </header>
    <section class="summary-info">
      <div class="summary-content">
        <p>📅 근무기간: 1997년 4월 ~ 1999년 12월</p>
        <p>🧑‍💼 직책: 주임 / 안양연수원, 수출정비부</p>
      </div>
    </section>
    <main class="gallery">
      <div class="image-card">
        <img src="samsung1.jpg" alt="삼성자동차 이미지 1" class="zoomable" />
        <p>부산 삼성자동차 공장내 연수원에서 딜러사 서비스매니저를 초정하여 정비교육을 가졌습니다. 그 때 단체사진입니다.</p>
      </div>
      <div class="image-card">
        <img src="samsung2.jpg" alt="삼성자동차 이미지 2" class="zoomable" />
        <p>삼성자동차 양평사업소 현장 기사들과 워크숍을 다녀왔습니다.</p>
      </div>
      <div class="image-card">
        <img src="samsung3.jpg" alt="삼성자동차 이미지 3" class="zoomable" />
        <p>삼성자동차 요르단 서비스매니저들과 양평사업소를 방문하여 설명 중 쵤영하였습니다.</p>
      </div>
      <div class="image-card">
        <img src="samsung4.jpg" alt="삼성자동차 이미지 4" class="zoomable" />
        <p>부산 삼성자동차 공장내 연수원에서 딜러사 서비스매니저를 초정하여 정비교육을 가졌습니다.</p>
      </div>
      
    </main>

    <!-- 이미지 확대용 모달 -->
    <div id="imageModal" class="modal">
      <span class="close-btn" onclick="closeModal()">✕</span>
      <img id="modalImg" class="modal-content" src="" alt="확대 이미지" />
    </div>

    <script>
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      const zoomableImages = document.querySelectorAll('.zoomable');

      zoomableImages.forEach((img) => {
        img.addEventListener('click', () => {
          modalImg.src = img.src;
          modal.style.display = 'flex';
          modalImg.classList.remove('fullscreen');
        });
      });

      function closeModal() {
        modal.style.display = 'none';
        modalImg.src = '';
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
        }
      });
    </script>
  </main>

  <script>
    const images = document.querySelectorAll('.zoomable');
    images.forEach((img) => {
      img.addEventListener('click', () => {
        img.classList.add('fullscreen');
      });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.fullscreen').forEach((img) => {
          img.classList.remove('fullscreen');
        });
      }
    });
  </script>
  </body>
</html>
