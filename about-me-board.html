    <!-- 메인 콘텐츠 섹션 -->
    <main class="main-content about-me-content">
      <div class="board-container">
        <!-- 메인 콘텐츠 -->
        <div class="board-main">
          <div class="board-header">
            <h1>About Me 소개</h1>
            <p>
              자동차 기술과 서비스 관리 경험을 바탕으로 한 이력서와 자기소개서를
              통해 나의 경험을 공유합니다
            </p>
          </div>

          <!-- 검색 및 필터 바 -->
          <div class="search-filter-bar">
            <div class="search-group">
              <input
                type="text"
                id="search-input"
                placeholder="이력서 또는 자기소개서 검색..."
                class="search-input"
              />
              <button class="search-btn">🔍</button>
            </div>
          </div>
          <div class="result-info">
            <span id="result-count">총 3건</span>
          </div>

          <!-- 게시판 테이블 -->
          <div class="board-table">
            <table>
              <thead>
                <tr>
                  <th class="col-number">번호</th>
                  <th class="col-title">제목</th>
                  <th class="col-category">카테고리</th>
                  <th class="col-author">작성자</th>
                  <th class="col-date">등록일</th>
                  <th class="col-views">조회수</th>
                </tr>
              </thead>
              <tbody id="board-tbody">
                <!-- 데이터는 JavaScript로 동적 생성됩니다 -->
              </tbody>
            </table>
          </div>

          <!-- 페이지네이션 -->
          <div class="pagination" id="pagination">
            <!-- 페이지네이션은 JavaScript로 동적 생성됩니다 -->
          </div>
        </div>
      </div>
    </main>

    <!-- 푸터 -->

      <div class="footer-content">

      </div>
    </footer>

    <script src="scripts.js"></script>
    <script>
      // 게시판 데이터
      const boardData = [
        {
          id: 4,
          title: '이호기의 영문 자기소개서',
          link: 'resume/Hoki_Lee_Cover_Letter_EN.pdf',
          category: '자기소개',
          author: '이호기',
          date: '06-01',
          views: 0,
          content: '영문으로 작성된 이호기의 자기소개서입니다.',
        },
        {
          id: 3,
          title: '이호기의 한글 자기소개서',
          link: 'resume/Hoki_Lee_Cover_Letter_KR.pdf',
          category: '자기소개',
          author: '이호기',
          date: '06-01',
          views: 0,
          content: '한글로 작성된 이호기의 자기소개서입니다.',
        },
        {
          id: 2,
          title: '이호기의 영문 이력서',
          link: 'resume/Hoki_Lee_Resume_EN.pdf',
          category: '이력서',
          author: '이호기',
          date: '06-01',
          views: 0,
          content: '영문으로 작성된 이호기의 이력서입니다.',
        },
        {
          id: 1,
          title: '이호기의 한글 이력서',
          link: 'resume/Hoki_Lee_Resume_KR.pdf',
          category: '이력서',
          author: '이호기',
          date: '06-01',
          views: 0,
          content: '한글로 작성된 이호기의 이력서입니다.',
        },
      ];

      // 페이지네이션 설정
      const itemsPerPage = 10;
      let currentPage = 1;

      // 검색 및 필터 변수
      let filteredData = [...boardData];
      let searchTerm = '';

      // 7일 이내 게시글인지 자동 판단하는 함수
      function isNewPost(postDate) {
        const today = new Date();
        const currentYear = today.getFullYear();
        const postDateObj = new Date(`${currentYear}-${postDate}`);

        // 올해가 아닌 경우 작년으로 계산
        if (postDateObj > today) {
          postDateObj.setFullYear(currentYear - 1);
        }

        const diffTime = today - postDateObj;
        const diffDays = diffTime / (1000 * 60 * 60 * 24);

        return diffDays <= 7;
      }

      // 조회수 관리 함수들
      function getViews(id) {
        return parseInt(localStorage.getItem(`about_views_${id}`)) || 0;
      }

      function increaseViews(id) {
        const currentViews = getViews(id);
        const newViews = currentViews + 1;
        localStorage.setItem(`about_views_${id}`, newViews);
        return newViews;
      }

      function updateViewsDisplay(id, viewsElement) {
        const views = getViews(id);
        viewsElement.textContent = views;
      }

      // 검색 및 필터링 함수
      function filterBoardData() {
        filteredData = boardData.filter((item) => {
          // 검색어 필터링 (제목과 내용에서 검색)
          const matchesSearch =
            searchTerm === '' ||
            item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.content &&
              item.content.toLowerCase().includes(searchTerm.toLowerCase()));

          return matchesSearch;
        });

        // 필터링 후 첫 페이지로 이동
        currentPage = 1;
        renderBoardTable(currentPage);
        renderPagination();
        updateResultCount();
      }

      // 검색어 변경 처리
      function handleSearchChange(event) {
        searchTerm = event.target.value;
        filterBoardData();
      }

      // 결과 개수 업데이트
      function updateResultCount() {
        const resultCount = document.getElementById('result-count');
        if (resultCount) {
          resultCount.textContent = `총 ${filteredData.length}건`;
        }
      }

      // 게시판 테이블 렌더링
      function renderBoardTable(page = 1) {
        const tbody = document.getElementById('board-tbody');
        const startIndex = (page - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = filteredData.slice(startIndex, endIndex);

        tbody.innerHTML = '';

        pageData.forEach((item) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="col-number">${item.id}</td>
            <td class="col-title">
              <a href="${item.link}" ${
            item.link !== '#' ? 'target="_blank"' : ''
          } onclick="handleLinkClick(${item.id}, '${item.link}')">${
            item.title
          }</a>
              ${
                isNewPost(item.date) ? '<span class="new-badge">NEW</span>' : ''
              }
            </td>
            <td class="col-category">${item.category}</td>
            <td class="col-author">${item.author}</td>
            <td class="col-date">${item.date}</td>
            <td class="col-views" id="views_${item.id}">0</td>
          `;
          tbody.appendChild(row);

          // 조회수 표시 업데이트
          updateViewsDisplay(
            item.id,
            document.getElementById(`views_${item.id}`)
          );
        });
      }

      // 페이지네이션 렌더링
      function renderPagination() {
        const pagination = document.getElementById('pagination');
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        let paginationHTML = '';

        if (totalPages > 1) {
          // 이전 페이지 버튼
          if (currentPage > 1) {
            paginationHTML += `<button onclick="changePage(${
              currentPage - 1
            })" class="page-btn">이전</button>`;
          }

          // 페이지 번호들
          for (let i = 1; i <= totalPages; i++) {
            if (i === currentPage) {
              paginationHTML += `<button class="page-btn active">${i}</button>`;
            } else {
              paginationHTML += `<button onclick="changePage(${i})" class="page-btn">${i}</button>`;
            }
          }

          // 다음 페이지 버튼
          if (currentPage < totalPages) {
            paginationHTML += `<button onclick="changePage(${
              currentPage + 1
            })" class="page-btn">다음</button>`;
          }
        }

        pagination.innerHTML = paginationHTML;
      }

      // 페이지 변경
      function changePage(page) {
        currentPage = page;
        renderBoardTable(currentPage);
        renderPagination();
      }

      // 링크 클릭 처리 (조회수 증가)
      function handleLinkClick(id, link) {
        if (link !== '#') {
          // 조회수 증가
          const newViews = increaseViews(id);

          // 화면에 즉시 반영
          const viewsElement = document.getElementById(`views_${id}`);
          if (viewsElement) {
            viewsElement.textContent = newViews;
          }

          // 새 탭에서 링크 열기
          window.open(link, '_blank');
        }
      }

      // 검색 및 필터 이벤트 리스너 설정
      function setupSearchAndFilter() {
        const searchInput = document.getElementById('search-input');

        if (searchInput) {
          searchInput.addEventListener('input', handleSearchChange);
        }
      }

      // 현재 날짜 가져오기 (MM-DD 형식)
      function getCurrentDate() {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${month}-${day}`;
      }

      // 초기 로드
      document.addEventListener('DOMContentLoaded', function () {
        renderBoardTable(currentPage);
        renderPagination();
        setupSearchAndFilter();
        updateResultCount();
      });
    </script>
  </body>
