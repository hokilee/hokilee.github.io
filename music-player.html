<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>음악 플레이어</title>
    <style>
      body {
        margin: 20px;
        font-family: sans-serif;
        text-align: center;
        background-color: #f8f9fa;
      }

      #musicSelector {
        margin-top: 10px;
        padding: 8px 12px;
        font-size: 1em;
        border-radius: 8px;
        background-color: #fff;
        border: 1px solid #ccc;
        width: 80%;
      }

      audio {
        width: 90%;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <p><strong>🎵 배경 음악이 재생 중입니다</strong></p>

    <audio id="audioPlayer" controls autoplay loop>
      <source
        id="audioSource"
        src="music/cozycoffeehouse.mp3"
        type="audio/mp3"
      />
      브라우저가 오디오를 지원하지 않습니다.
    </audio>

    <select id="musicSelector"></select>
  </body>
</html>
