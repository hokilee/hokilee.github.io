    <!-- 메인 콘텐츠 섹션 -->
    <main class="main-content latest-content-board">
      <div class="board-container">
        <!-- 메인 콘텐츠 -->
        <div class="board-main">
          <div class="board-header">
            <h1>이전 자료 게시판</h1>
            <p>
              예전에 게시판에 올렸던 하루 한 생각 자료들을 모아 PDF 책으로
              정리했습니다. 자유롭게 다운로드하여 읽어보시기 바랍니다.
            </p>
          </div>

          <!-- 검색 및 필터 바 -->
          <div class="search-filter-bar">
            <div class="search-group">
              <input
                type="text"
                id="searchInput"
                placeholder="자료 제목으로 검색..."
                class="search-input"
              />
              <button id="searchBtn" class="search-btn">🔍</button>
            </div>
          </div>
          <div class="result-info">
            <span id="result-count">총 0건</span>
          </div>

          <!-- 게시판 테이블 -->
          <div class="board-table">
            <table>
              <thead>
                <tr>
                  <th class="col-number">번호</th>
                  <th class="col-title">제목</th>
                  <th class="col-category">카테고리</th>
                  <th class="col-author">작성자</th>
                  <th class="col-date">등록일</th>
                </tr>
              </thead>
              <tbody id="boardTableBody">
                <!-- 동적으로 생성되는 게시글 목록 -->
              </tbody>
            </table>
          </div>

          <!-- 현재 페이지 정보 -->
          <div class="page-info">
            <span id="current-page-info"
              >현재 페이지: <strong>1</strong> / 1 페이지</span
            >
          </div>

          <!-- 페이지네이션 -->
          <div class="pagination" id="pagination">
            <!-- 동적으로 생성되는 페이지네이션 -->
          </div>
        </div>
      </div>
    </main>

    <script>
      // 전역 변수
      let currentPage = 1;
      let itemsPerPage = 10;
      let filteredData = [];
      let currentFilter = '';

      // 게시판 데이터
      let boardData = [];
      let totalPages = 0;

      // 데이터 로드 함수
      function loadBoardData() {
        try {
          console.log('loadBoardData 실행 중...');
          console.log('previousContentData:', typeof previousContentData);

          // 외부 데이터가 로드되었는지 확인
          if (
            typeof previousContentData !== 'undefined' &&
            previousContentData.length > 0
          ) {
            boardData = previousContentData.map((item) => ({
              id: item.id,
              title: item.title,
              link: item.link,
              category: item.category,
              author: item.author,
              date: item.date,
            }));

            totalPages = Math.ceil(boardData.length / itemsPerPage);
            console.log('데이터 로드 완료:', boardData.length);
            console.log('boardData 샘플:', boardData.slice(0, 3));

            // 초기화 실행
            initializeBoard();
          } else {
            console.log('외부 데이터가 아직 로드되지 않음. 재시도...');
            setTimeout(loadBoardData, 100);
          }
        } catch (error) {
          console.error('데이터 로드 중 오류:', error);
          setTimeout(loadBoardData, 100);
        }
      }

      // 게시판 테이블 렌더링
      function renderBoardTable(page) {
        const startIndex = (page - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = boardData.slice(startIndex, endIndex);

        const tbody = document.getElementById('boardTableBody');
        tbody.innerHTML = '';

        pageData.forEach((item) => {
          const row = document.createElement('tr');
          row.className = 'board-row';

          // NEW 배지 표시 (7일 이내)
          const isNew = isWithinDays(item.date, 7);
          const newBadge = isNew ? '<span class="new-badge">NEW</span>' : '';

          row.innerHTML = `
            <td class="col-number">${item.id}</td>
            <td class="col-title">
              <a href="javascript:void(0)" onclick="handleLinkClick('${item.link}')">${item.title}</a>
              ${newBadge}
            </td>
            <td class="col-category">${item.category}</td>
            <td class="col-author">${item.author}</td>
            <td class="col-date">${item.date}</td>
          `;

          tbody.appendChild(row);
        });
      }

      // 필터링된 게시판 테이블 렌더링
      function renderFilteredBoardTable(page) {
        const startIndex = (page - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = filteredData.slice(startIndex, endIndex);

        const tbody = document.getElementById('boardTableBody');
        tbody.innerHTML = '';

        pageData.forEach((item) => {
          const row = document.createElement('tr');
          row.className = 'board-row';

          // NEW 배지 표시 (7일 이내)
          const isNew = isWithinDays(item.date, 7);
          const newBadge = isNew ? '<span class="new-badge">NEW</span>' : '';

          row.innerHTML = `
            <td class="col-number">${item.id}</td>
            <td class="col-title">
              <a href="javascript:void(0)" onclick="handleLinkClick('${item.link}')">${item.title}</a>
              ${newBadge}
            </td>
            <td class="col-category">${item.category}</td>
            <td class="col-author">${item.author}</td>
            <td class="col-date">${item.date}</td>
          `;

          tbody.appendChild(row);
        });
      }

      // 페이지네이션 렌더링
      function renderPagination() {
        const pagination = document.getElementById('pagination');
        const dataLength = currentFilter
          ? filteredData.length
          : boardData.length;
        const totalPages = Math.ceil(dataLength / itemsPerPage);

        pagination.innerHTML = '';

        if (totalPages <= 1) return;

        // 이전 페이지 버튼
        if (currentPage > 1) {
          const prevBtn = document.createElement('button');
          prevBtn.textContent = '◀';
          prevBtn.onclick = () => changePage(currentPage - 1);
          pagination.appendChild(prevBtn);
        }

        // 페이지 번호 버튼들 - 5개 페이지를 기본으로 표시
        let startPage, endPage;

        if (totalPages <= 5) {
          startPage = 1;
          endPage = totalPages;
        } else {
          if (currentPage <= 3) {
            startPage = 1;
            endPage = 5;
          } else if (currentPage >= totalPages - 2) {
            startPage = totalPages - 4;
            endPage = totalPages;
          } else {
            startPage = currentPage - 2;
            endPage = currentPage + 2;
          }
        }

        for (let i = startPage; i <= endPage; i++) {
          const pageBtn = document.createElement('button');
          pageBtn.textContent = i;
          pageBtn.className = i === currentPage ? 'active' : '';
          pageBtn.onclick = () => changePage(i);
          pagination.appendChild(pageBtn);
        }

        // 다음 페이지 버튼
        if (currentPage < totalPages) {
          const nextBtn = document.createElement('button');
          nextBtn.textContent = '▶';
          nextBtn.onclick = () => changePage(currentPage + 1);
          pagination.appendChild(nextBtn);
        }
      }

      // 페이지 변경
      function changePage(page) {
        currentPage = page;
        if (currentFilter) {
          renderFilteredBoardTable(page);
        } else {
          renderBoardTable(page);
        }
        renderPagination();
        updateResultCount();
        updateCurrentPageInfo();
      }

      // 검색 및 필터링 설정
      function setupSearchAndFilter() {
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        // 검색 버튼 클릭 이벤트
        if (searchBtn) {
          searchBtn.addEventListener('click', function () {
            performSearch();
          });
        }

        // 엔터 키 이벤트
        if (searchInput) {
          searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
              performSearch();
            }
          });
        }
      }

      // 검색 실행
      function performSearch() {
        const searchTerm = document
          .getElementById('searchInput')
          .value.toLowerCase();

        if (!boardData || boardData.length === 0) {
          console.error('boardData가 로드되지 않았습니다.');
          return;
        }

        if (searchTerm === '') {
          // 검색어가 비어있으면 전체 데이터 표시
          currentFilter = '';
          currentPage = 1;
          renderBoardTable(currentPage);
          renderPagination();
          updateResultCount();
          updateCurrentPageInfo();
          return;
        }

        filteredData = boardData.filter((item) => {
          return item.title.toLowerCase().includes(searchTerm);
        });

        currentFilter = 'search';
        currentPage = 1;
        renderFilteredBoardTable(currentPage);
        renderPagination();
        updateResultCount();
        updateCurrentPageInfo();
      }

      // 결과 개수 업데이트
      function updateResultCount() {
        const resultCount = document.getElementById('result-count');
        const dataLength = currentFilter
          ? filteredData.length
          : boardData.length;

        if (resultCount) {
          resultCount.textContent = `총 ${dataLength}건`;
        }
      }

      // 현재 페이지 정보 업데이트
      function updateCurrentPageInfo() {
        const currentPageInfo = document.getElementById('current-page-info');
        const dataLength = currentFilter
          ? filteredData.length
          : boardData.length;
        const totalPages = Math.ceil(dataLength / itemsPerPage);

        if (currentPageInfo) {
          currentPageInfo.innerHTML = `현재 페이지: <strong>${currentPage}</strong> / ${totalPages} 페이지`;
        }
      }

      // 날짜가 지정된 일수 이내인지 확인
      function isWithinDays(dateStr, days) {
        const today = new Date();
        const itemDate = parseDate(dateStr);
        const diffTime = Math.abs(today - itemDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays <= days;
      }

      // 날짜 문자열을 Date 객체로 변환
      function parseDate(dateStr) {
        const [month, day] = dateStr.split('-').map(Number);
        const currentYear = new Date().getFullYear();
        return new Date(currentYear, month - 1, day);
      }

      // 링크 클릭 처리
      function handleLinkClick(link) {
        if (link && link !== '#') {
          // PDF 파일인 경우 새 탭에서 열기
          if (link.toLowerCase().endsWith('.pdf')) {
            window.open(link, '_blank');
          } else {
            window.open(link, '_blank');
          }
        }
      }

      // 초기화 및 이벤트 리스너 설정
      function initializeBoard() {
        console.log('게시판 초기화 시작');
        console.log('boardData 확인:', boardData.length);

        // 초기 렌더링
        renderBoardTable(1);
        renderPagination();
        updateResultCount();
        updateCurrentPageInfo();
        setupSearchAndFilter();
      }

      // 페이지 로드 시 초기화
      document.addEventListener('DOMContentLoaded', function () {
        console.log('DOM이 로드되었습니다. 데이터 로드를 시작합니다.');
        loadBoardData();
      });

      // 연도 표시
      const yearElement = document.getElementById('year');
      if (yearElement) {
        yearElement.textContent = new Date().getFullYear();
      }
    </script>

    <footer class="footer">
      <p>Copyright ⓒ <span id="year"></span> Hoki Lee.</p>
    </footer>
  </body>
