<!DOCTYPE html>
<html>
  <head>
    <title>Phillips Curve Generator</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: white;
      }
      canvas {
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <canvas id="phillipsCanvas" width="400" height="300"></canvas>
    <script>
      const canvas = document.getElementById('phillipsCanvas');
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, 0, 400, 300);

      // Grid lines
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(50, 50);
      ctx.lineTo(50, 250);
      ctx.moveTo(50, 250);
      ctx.lineTo(350, 250);
      ctx.stroke();

      // Y-axis labels (Inflation Rate)
      ctx.fillStyle = '#333';
      ctx.font = '12px Arial';
      ctx.fillText('10%', 20, 60);
      ctx.fillText('8%', 20, 100);
      ctx.fillText('6%', 20, 140);
      ctx.fillText('4%', 20, 180);
      ctx.fillText('2%', 20, 220);
      ctx.fillText('0%', 15, 270);

      // X-axis labels (Unemployment Rate)
      ctx.fillText('0%', 50, 270);
      ctx.fillText('2%', 100, 270);
      ctx.fillText('4%', 150, 270);
      ctx.fillText('6%', 200, 270);
      ctx.fillText('8%', 250, 270);
      ctx.fillText('10%', 300, 270);

      // Axis labels
      ctx.font = '14px Arial';
      ctx.fillText('실업률 (Unemployment Rate)', 200, 290);
      ctx.save();
      ctx.translate(15, 150);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('물가상승률 (Inflation Rate)', 0, 0);
      ctx.restore();

      // Phillips Curve
      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(50, 220);
      ctx.quadraticCurveTo(100, 180, 150, 140);
      ctx.quadraticCurveTo(200, 100, 250, 80);
      ctx.quadraticCurveTo(300, 60, 350, 50);
      ctx.stroke();

      // Points on the curve
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(100, 180, 4, 0, 2 * Math.PI);
      ctx.arc(150, 140, 4, 0, 2 * Math.PI);
      ctx.arc(200, 100, 4, 0, 2 * Math.PI);
      ctx.arc(250, 80, 4, 0, 2 * Math.PI);
      ctx.arc(300, 60, 4, 0, 2 * Math.PI);
      ctx.fill();

      // Title
      ctx.font = 'bold 16px Arial';
      ctx.fillStyle = '#333';
      ctx.fillText('필립스 곡선 (Phillips Curve)', 200, 30);

      // Arrow indicating trade-off
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(200, 120);
      ctx.lineTo(220, 100);
      ctx.stroke();

      // Arrow head
      ctx.beginPath();
      ctx.moveTo(220, 100);
      ctx.lineTo(215, 95);
      ctx.lineTo(215, 105);
      ctx.fill();

      ctx.font = '10px Arial';
      ctx.fillText('반비례 관계', 230, 95);
    </script>
  </body>
</html>
