      <div class="date">2024-07-19</div>
      <div class="content">
        <p>
          텔로미어(Telomere)는 세포의 수명을 결정하는 염색체 끝 부분의 유전자
          조각입니다.
        </p>
        <p>
          일반적으로 세포분열이 반복될수록 텔로미어가 점점 짧아지며, 텔로미어가
          너무 짧아지면 세포는 더 이상 분열하지 못하고 노화 또는 사멸하게
          됩니다.
        </p>
        <p>
          하지만 생식세포와 암세포는 텔로미어가 짧아지지 않아 무제한으로 증식할
          수 있습니다.
        </p>
