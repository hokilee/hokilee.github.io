      <h1>단풍 드는 날</h1>
      <div class="date">2025-07-08</div>
      <div class="content">
        <p>
          <blockquote>
            "단풍 드는 날"<br />
    
            - 도종환 시집, 흔들리지 않고 피는 꽃이 어디 있으랴,,
          </blockquote>
          <p>
            버려야 할 것이<br />
            무엇인지를 아는 순간부터<br />
            나무는 가장 아름답게 불탄다
          </p>
          <p>
            제 삶의 이유였던 것<br />
            제 몸의 전부였던 것<br />
            아낌없이 버리기로 결심하면서<br />
            나무는 생의 절정에 선다
          </p>
          <p>
            방하착(放下着)<br />
            제가 키워온,<br />
            그러나 이 제는 무거워진<br />
            제 몸 하나씩 내려놓으면서
          </p>
          <p>
            가장 황홀한 빛깔로<br />
            우리도 물이 드는 날
          </p>
        </p>
