          title: '내가 바랐던 삶의 모양일까?',
          link: 'thought-detail-1.html',
          category: '하루 한생각',
          author: '이호기',
          date: '06-15',
          views: 0,
          summary: '어릴 적 꿈꿨던 삶과 현재의 나를 돌아보며',

      // 페이지네이션 설정
      const itemsPerPage = 10;
      let currentPage = 1;

      // 검색 및 필터 변수
      let filteredData = [...dailyThoughtsData];
      let searchTerm = '';
      let selectedCategory = '';
      let selectedAuthor = '';

      // 페이지 로드 시 실행
      document.addEventListener('DOMContentLoaded', function () {
        renderBoardTable(currentPage);
        renderPagination();
        updateResultCount();
        setupEventListeners();
      });

      // 이벤트 리스너 설정
      function setupEventListeners() {
        const searchInput = document.getElementById('search-input');
        const categoryFilter = document.getElementById('category-filter');
        const authorFilter = document.getElementById('author-filter');
        const resetBtn = document.getElementById('reset-filters');

        searchInput.addEventListener('input', handleSearchChange);
        categoryFilter.addEventListener('change', handleCategoryFilter);
        authorFilter.addEventListener('change', handleAuthorFilter);
        resetBtn.addEventListener('click', resetFilters);
      }

      // 검색어 변경 처리
      function handleSearchChange() {
        searchTerm = document.getElementById('search-input').value;
        filterBoardData();
      }

      // 카테고리 필터 변경 처리
      function handleCategoryFilter() {
        selectedCategory = document.getElementById('category-filter').value;
        filterBoardData();
      }

      // 작성자 필터 변경 처리
      function handleAuthorFilter() {
        selectedAuthor = document.getElementById('author-filter').value;
        filterBoardData();
      }

      // 필터 초기화
      function resetFilters() {
        document.getElementById('search-input').value = '';
        document.getElementById('category-filter').value = '';
        document.getElementById('author-filter').value = '';

        searchTerm = '';
        selectedCategory = '';
        selectedAuthor = '';

        filteredData = [...dailyThoughtsData];
        currentPage = 1;
        renderBoardTable(currentPage);
        renderPagination();
        updateResultCount();
      }

      // 게시판 데이터 필터링
      function filterBoardData() {
        filteredData = dailyThoughtsData.filter((item) => {
          // 검색어 필터링
          const matchesSearch =
            searchTerm === '' ||
            item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.summary &&
              item.summary.toLowerCase().includes(searchTerm.toLowerCase()));

          // 카테고리 필터링
          const matchesCategory =
            selectedCategory === '' || item.category === selectedCategory;

          // 작성자 필터링
          const matchesAuthor =
            selectedAuthor === '' || item.author === selectedAuthor;

          return matchesSearch && matchesCategory && matchesAuthor;
        });

        // 필터링 후 첫 페이지로 이동
        currentPage = 1;
        renderBoardTable(currentPage);
        renderPagination();
        updateResultCount();
      }

      // 7일 이내 게시글인지 자동 판단하는 함수
      function isNewPost(postDate) {
        const today = new Date();
        const currentYear = today.getFullYear();
        const postDateObj = new Date(`${currentYear}-${postDate}`);

        // 올해가 아닌 경우 작년으로 계산
        if (postDateObj > today) {
          postDateObj.setFullYear(currentYear - 1);
        }

        const diffTime = today - postDateObj;
        const diffDays = diffTime / (1000 * 60 * 60 * 24);

        return diffDays <= 7;
      }

      // 조회수 관리 함수들
      function getViews(id) {
        return (
          parseInt(localStorage.getItem(`daily_thoughts_views_${id}`)) || 0
        );
      }

      function increaseViews(id) {
        const currentViews = getViews(id);
        const newViews = currentViews + 1;
        localStorage.setItem(`daily_thoughts_views_${id}`, newViews);
        return newViews;
      }

      function updateViewsDisplay(id, viewsElement) {
        const views = getViews(id);
        viewsElement.textContent = views;
      }

      // 게시판 테이블 렌더링
      function renderBoardTable(page) {
        const tbody = document.getElementById('board-tbody');
        const startIndex = (page - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = filteredData.slice(startIndex, endIndex);

        tbody.innerHTML = '';

        pageData.forEach((item) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="col-number">${item.id}</td>
            <td class="col-title">
              <a href="${item.link}" onclick="handleLinkClick(${item.id}, '${
            item.link
          }')">${item.title}</a>
              ${
                isNewPost(item.date) ? '<span class="new-badge">NEW</span>' : ''
              }
            </td>
            <td class="col-category">
              <span class="category-badge">${item.category}</span>
            </td>
            <td class="col-author">${item.author}</td>
            <td class="col-date">${item.date}</td>
            <td class="col-views" id="views_${item.id}">0</td>
          `;
          tbody.appendChild(row);

          // 조회수 표시 업데이트
          updateViewsDisplay(
            item.id,
            document.getElementById(`views_${item.id}`)
          );
        });
      }

      // 페이지네이션 렌더링
      function renderPagination() {
        const pagination = document.getElementById('pagination');
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        if (totalPages <= 1) {
          pagination.innerHTML = '';
          return;
        }

        let paginationHTML = '';

        // 이전 페이지 버튼
        if (currentPage > 1) {
          paginationHTML += `<button onclick="goToPage(${
            currentPage - 1
          })" class="page-btn">이전</button>`;
        }

        // 페이지 번호들
        for (let i = 1; i <= totalPages; i++) {
          if (
            i === 1 ||
            i === totalPages ||
            (i >= currentPage - 2 && i <= currentPage + 2)
          ) {
            paginationHTML += `<button onclick="goToPage(${i})" class="page-btn ${
              i === currentPage ? 'active' : ''
            }">${i}</button>`;
          } else if (i === currentPage - 3 || i === currentPage + 3) {
            paginationHTML += '<span class="page-ellipsis">...</span>';
          }
        }

        // 다음 페이지 버튼
        if (currentPage < totalPages) {
          paginationHTML += `<button onclick="goToPage(${
            currentPage + 1
          })" class="page-btn">다음</button>`;
        }

        pagination.innerHTML = paginationHTML;
      }

      // 페이지 이동
      function goToPage(page) {
        currentPage = page;
        renderBoardTable(currentPage);
        renderPagination();
      }

      // 결과 개수 업데이트
      function updateResultCount() {
        const resultCount = document.getElementById('result-count');
        resultCount.textContent = filteredData.length;
      }

      // 링크 클릭 처리
      function handleLinkClick(id, link) {
        if (link !== '#') {
          increaseViews(id);
          updateViewsDisplay(id, document.getElementById(`views_${id}`));
        }
      }
    </script>
