<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eBook Series 자료실 - 이호기</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="daily-thoughts-board-style.css" />
  </head>
  <body>
    <div class="board-container">
      <a href="../index.html" class="back-to-main">← 메인으로 돌아가기</a>

      <div class="board-header">
        <h1>eBook Series</h1>
        <p>
          영업, 마케팅, 성과 분석 등 실무에 바로 활용할 수 있는 PDF 자료를 제공합니다.
          필요한 문서를 다운로드하여 업무에 활용해 보세요.
        </p>
      </div>

      <div class="search-filter-section">
        <div class="search-filter-row">
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="제목이나 요약으로 검색해보세요..."
            />
          </div>
          <div class="filter-group">
            <select id="category-filter" class="filter-select">
              <option value="">전체 카테고리</option>
              <option value="eBook Series">eBook Series</option>
            </select>
            <select id="author-filter" class="filter-select">
              <option value="">전체 작성자</option>
              <option value="이호기">이호기</option>
            </select>
            <button id="reset-filters" class="reset-btn">필터 초기화</button>
          </div>
        </div>
      </div>

      <div class="result-count">
        총 <span id="result-count">0</span>개의 자료가 있습니다.
      </div>

      <div class="board-table">
        <table>
          <thead>
            <tr>
              <th class="col-number">번호</th>
              <th class="col-title">제목</th>
              <th class="col-category">카테고리</th>
              <th class="col-author">작성자</th>
              <th class="col-date">등록일</th>
              <th class="col-views">조회수</th>
              <th class="col-download">다운로드</th>
            </tr>
          </thead>
          <tbody id="board-tbody"></tbody>
        </table>
      </div>

      <div id="pagination" class="pagination"></div>
    </div>

    <script src="daily-thoughts-data.js"></script>
    <script>
      const itemsPerPage = 10;
      let currentPage = 1;
      let filteredData = [...dailyThoughtsData];

      const searchInput = document.getElementById('search-input');
      const categoryFilter = document.getElementById('category-filter');
      const authorFilter = document.getElementById('author-filter');
      const resetBtn = document.getElementById('reset-filters');

      function isWithinDays(dateStr, days) {
        const currentYear = new Date().getFullYear();
        const targetDate = new Date(`${currentYear}-${dateStr}`);
        const today = new Date();
        const diff = (today - targetDate) / (1000 * 60 * 60 * 24);
        return diff <= days && diff >= 0;
      }

      function downloadFile(link) {
        if (!link) return;
        const a = document.createElement('a');
        a.href = link;
        a.download = link.split('/').pop();
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function incrementViewCount(id) {
        const store = JSON.parse(localStorage.getItem('ebookSeriesViews') || '{}');
        store[id] = (store[id] || 0) + 1;
        localStorage.setItem('ebookSeriesViews', JSON.stringify(store));
        return store[id];
      }

      function getViewCount(id, fallback = 0) {
        const store = JSON.parse(localStorage.getItem('ebookSeriesViews') || '{}');
        return store[id] || fallback || 0;
      }

      function updateViewDisplay(id, count) {
        const rows = document.querySelectorAll('.board-row');
        rows.forEach((row) => {
          const idCell = row.querySelector('.col-number');
          if (idCell && Number(idCell.textContent) === id) {
            const viewCell = row.querySelector('.col-views');
            if (viewCell) viewCell.textContent = count;
          }
        });
      }

      function renderTable(page = 1) {
        const start = (page - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = filteredData.slice(start, end);
        const tbody = document.getElementById('board-tbody');
        tbody.innerHTML = '';

        pageData.forEach((item) => {
          const row = document.createElement('tr');
          row.className = 'board-row';

          const isNew = isWithinDays(item.date, 7);
          const newBadge = isNew ? '<span class="new-badge">NEW</span>' : '';

          row.innerHTML = `
            <td class="col-number">${item.id}</td>
            <td class="col-title">
              <span class="title-text">${item.title}</span>
              ${newBadge}
            </td>
            <td class="col-category">${item.category}</td>
            <td class="col-author">${item.author}</td>
            <td class="col-date">${item.date}</td>
            <td class="col-views">${getViewCount(item.id, item.views)}</td>
            <td class="col-download">
              <button class="download-btn" data-id="${item.id}" data-link="${item.link}">다운로드</button>
            </td>
          `;

          const downloadBtn = row.querySelector('.download-btn');
          downloadBtn.addEventListener('click', () => {
            const newCount = incrementViewCount(item.id);
            updateViewDisplay(item.id, newCount);
            downloadFile(item.link);
          });

          tbody.appendChild(row);
        });

        document.getElementById('result-count').textContent = filteredData.length;
      }

      function renderPagination() {
        const pagination = document.getElementById('pagination');
        const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
        pagination.innerHTML = '';

        if (currentPage > 1) {
          const prev = document.createElement('button');
          prev.textContent = '◀';
          prev.onclick = () => changePage(currentPage - 1);
          pagination.appendChild(prev);
        }

        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement('button');
          btn.textContent = i;
          if (i === currentPage) btn.classList.add('active');
          btn.onclick = () => changePage(i);
          pagination.appendChild(btn);
        }

        if (currentPage < totalPages) {
          const next = document.createElement('button');
          next.textContent = '▶';
          next.onclick = () => changePage(currentPage + 1);
          pagination.appendChild(next);
        }
      }

      function changePage(page) {
        currentPage = page;
        renderTable(page);
        renderPagination();
      }

      function applyFilters() {
        const keyword = searchInput.value.trim().toLowerCase();
        const category = categoryFilter.value;
        const author = authorFilter.value;

        filteredData = dailyThoughtsData.filter((item) => {
          const matchesKeyword =
            !keyword ||
            item.title.toLowerCase().includes(keyword) ||
            (item.summary && item.summary.toLowerCase().includes(keyword));
          const matchesCategory = !category || item.category === category;
          const matchesAuthor = !author || item.author === author;
          return matchesKeyword && matchesCategory && matchesAuthor;
        });

        currentPage = 1;
        renderTable();
        renderPagination();
      }

      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          applyFilters();
        }
      });

      categoryFilter.addEventListener('change', applyFilters);
      authorFilter.addEventListener('change', applyFilters);
      resetBtn.addEventListener('click', () => {
        searchInput.value = '';
        categoryFilter.value = '';
        authorFilter.value = '';
        filteredData = [...dailyThoughtsData];
        currentPage = 1;
        renderTable();
        renderPagination();
      });

      // 초기 렌더링
      renderTable();
      renderPagination();
    </script>
  </body>
</html>
