    <style>
      /* Detail 페이지 스타일 */
      .detail-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .detail-container {
        background: white;
        border-radius: 12px;
        max-width: 800px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .detail-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 24px 16px 24px;
        border-bottom: 1px solid #e0e0e0;
      }

      .detail-header h2 {
        margin: 0;
        color: #333;
        font-size: 24px;
        font-weight: 600;
        flex: 1;
        padding-right: 20px;
      }

      .detail-close {
        background: none;
        border: none;
        font-size: 28px;
        color: #666;
        cursor: pointer;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: background-color 0.2s;
      }

      .detail-close:hover {
        background-color: #f0f0f0;
      }

      .detail-meta {
        padding: 16px 24px;
        background-color: #f8f9fa;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 14px;
        color: #666;
      }

      .detail-meta span {
        display: flex;
        align-items: center;
      }

      .detail-category {
        background-color: #007bff;
        color: white;
        padding: 4px 12px;
        border-radius: 16px;
        font-weight: 500;
      }

      .detail-content {
        padding: 24px;
        line-height: 1.6;
        color: #333;
        font-size: 16px;
        min-height: 200px;
        white-space: pre-wrap;
      }

      .detail-actions {
        padding: 16px 24px 24px 24px;
        border-top: 1px solid #e0e0e0;
        text-align: center;
      }

      .btn-back {
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-back:hover {
        background-color: #5a6268;
      }

      /* 모바일 반응형 */
      @media (max-width: 768px) {
        .detail-container {
          margin: 10px;
          max-height: 95vh;
        }

        .detail-header h2 {
          font-size: 20px;
        }

        .detail-meta {
          flex-direction: column;
          gap: 8px;
        }

        .detail-content {
          padding: 16px;
          font-size: 14px;
        }
      }

      /* 다운로드 확인 다이얼로그 스타일 추가 */
      .download-confirm-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1001;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .download-confirm-container {
        background: white;
        border-radius: 12px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s ease-out;
      }

      .download-confirm-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px 16px 24px;
        border-bottom: 1px solid #e0e0e0;
      }

      .download-confirm-header h3 {
        margin: 0;
        color: #333;
        font-size: 20px;
        font-weight: 600;
      }

      .download-confirm-close {
        background: none;
        border: none;
        font-size: 24px;
        color: #666;
        cursor: pointer;
        padding: 0;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: background-color 0.2s;
      }

      .download-confirm-close:hover {
        background-color: #f0f0f0;
      }

      .download-confirm-content {
        padding: 24px;
      }

      .download-confirm-content p {
        margin: 0 0 24px 0;
        font-size: 16px;
        color: #333;
        text-align: center;
      }

      .download-confirm-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .btn-download-yes,
      .btn-download-no {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.2s;
        min-width: 120px;
      }

      .btn-download-yes {
        background-color: #007bff;
        color: white;
      }

      .btn-download-yes:hover {
        background-color: #0056b3;
      }

      .btn-download-no {
        background-color: #6c757d;
        color: white;
      }

      .btn-download-no:hover {
        background-color: #545b62;
      }

      /* 모바일 반응형 */
      @media (max-width: 768px) {
        .download-confirm-container {
          margin: 10px;
        }

        .download-confirm-actions {
          flex-direction: column;
        }

        .btn-download-yes,
        .btn-download-no {
          width: 100%;
        }
      }
    </style>
  </head>

    <script src="tech-book/tech-book-data.js"></script>
    <script>
      // 연도 표시
      document.getElementById('year').textContent = new Date().getFullYear();

      // 게시판 데이터 (외부 파일에서 로드)
      const boardData = techBookData;

      // 페이지네이션 설정
      const itemsPerPage = 10;
      let currentPage = 1;

      // 검색 및 필터 변수
      let filteredData = [...boardData];
      let searchTerm = '';

      // 7일 이내 게시글인지 자동 판단하는 함수
      function isNewPost(postDate) {
        const today = new Date();
        const currentYear = today.getFullYear();
        const postDateObj = new Date(`${currentYear}-${postDate}`);

        // 올해가 아닌 경우 작년으로 계산
        if (postDateObj > today) {
          postDateObj.setFullYear(currentYear - 1);
        }

        const diffTime = today - postDateObj;
        const diffDays = diffTime / (1000 * 60 * 60 * 24);

        return diffDays <= 7;
      }

      // 조회수 관리 함수들 (Firebase 사용)
      const boardType = 'tech-library'; // 기술자료 게시판 타입

      function getViews(id, callback) {
        if (typeof firebase !== 'undefined') {
          const viewRef = firebase.database().ref(`views/${boardType}/${id}`);
          viewRef.once('value', (snapshot) => {
            const views = snapshot.val() || 0;
            if (callback) callback(views);
          }, (error) => {
            console.error('조회수 가져오기 실패:', error);
            if (callback) callback(0);
          });
        } else {
          if (callback) callback(0);
        }
      }

      function increaseViews(id, callback) {
        if (typeof firebase !== 'undefined') {
          const viewRef = firebase.database().ref(`views/${boardType}/${id}`);
          viewRef.transaction((current) => {
            return (current || 0) + 1;
          }, (error, committed, snapshot) => {
            if (!error && committed) {
              const newViews = snapshot.val();
              if (callback) callback(newViews);
            } else if (error) {
              console.error('조회수 증가 실패:', error);
              if (callback) callback(0);
            }
          });
        } else {
          if (callback) callback(0);
        }
      }

      function updateViewsDisplay(id, viewsElement) {
        getViews(id, (views) => {
          if (viewsElement) {
            viewsElement.textContent = views;
          }
        });
      }

      // 검색 및 필터링 함수
      function filterBoardData() {
        filteredData = boardData.filter((item) => {
          // 검색어 필터링 (제목과 내용에서 검색)
          const matchesSearch =
            searchTerm === '' ||
            item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.content &&
              item.content.toLowerCase().includes(searchTerm.toLowerCase()));

          return matchesSearch;
        });

        // 필터링 후 첫 페이지로 이동
        currentPage = 1;
        renderBoardTable(currentPage);
        renderPagination();
        updateResultCount();
      }

      // 검색어 변경 처리
      function handleSearchChange(event) {
        searchTerm = event.target.value;
        filterBoardData();
      }

      // 결과 개수 업데이트
      function updateResultCount() {
        const resultCount = document.getElementById('result-count');
        if (resultCount) {
          resultCount.textContent = `총 ${filteredData.length}건`;
        }
      }

      // 게시판 테이블 렌더링
      function renderBoardTable(page = 1) {
        const tbody = document.getElementById('board-tbody');
        const startIndex = (page - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = filteredData.slice(startIndex, endIndex);

        tbody.innerHTML = '';

        pageData.forEach((item) => {
          const row = document.createElement('tr');

          // 링크 생성
          const linkElement = document.createElement('a');
          linkElement.href = item.link;
          if (item.link !== '#') {
            linkElement.target = '_blank';
          }
          linkElement.textContent = item.title;
          linkElement.addEventListener('click', function (e) {
            e.preventDefault();
            handleLinkClick(item.id, item.link);
          });

          // 제목 셀 생성
          const titleCell = document.createElement('td');
          titleCell.className = 'col-title';
          titleCell.appendChild(linkElement);

          // NEW 배지 추가
          if (isNewPost(item.date)) {
            const newBadge = document.createElement('span');
            newBadge.className = 'new-badge';
            newBadge.textContent = 'NEW';
            titleCell.appendChild(newBadge);
          }

          // 행 생성
          row.innerHTML = `
            <td class="col-number">${item.id}</td>
            <td class="col-category">${item.category}</td>
            <td class="col-author">${item.author}</td>
            <td class="col-date">${item.date}</td>
            <td class="col-views" id="views_${item.id}">0</td>
          `;

          // 제목 셀을 두 번째 위치에 삽입
          row.insertBefore(titleCell, row.children[1]);
          tbody.appendChild(row);

          // 조회수 표시 업데이트
          updateViewsDisplay(
            item.id,
            document.getElementById(`views_${item.id}`)
          );
        });
      }

      // 페이지네이션 렌더링
      function renderPagination() {
        const pagination = document.getElementById('pagination');
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        pagination.innerHTML = '';

        // 이전 버튼
        if (currentPage > 1) {
          const prevBtn = document.createElement('a');
          prevBtn.href = '#';
          prevBtn.className = 'page-btn prev';
          prevBtn.textContent = '이전';
          prevBtn.addEventListener('click', function (e) {
            e.preventDefault();
            changePage(currentPage - 1);
          });
          pagination.appendChild(prevBtn);
        }

        // 페이지 번호
        for (let i = 1; i <= totalPages; i++) {
          const pageBtn = document.createElement('a');
          pageBtn.href = '#';
          pageBtn.className = 'page-btn';
          if (i === currentPage) {
            pageBtn.classList.add('active');
          }
          pageBtn.textContent = i;
          pageBtn.addEventListener('click', function (e) {
            e.preventDefault();
            changePage(i);
          });
          pagination.appendChild(pageBtn);
        }

        // 다음 버튼
        if (currentPage < totalPages) {
          const nextBtn = document.createElement('a');
          nextBtn.href = '#';
          nextBtn.className = 'page-btn next';
          nextBtn.textContent = '다음';
          nextBtn.addEventListener('click', function (e) {
            e.preventDefault();
            changePage(currentPage + 1);
          });
          pagination.appendChild(nextBtn);
        }
      }

      // 페이지 변경
      function changePage(page) {
        currentPage = page;
        renderBoardTable(currentPage);
        renderPagination();
      }

      // 링크 클릭 처리 (조회수 증가)
      function handleLinkClick(id, link) {
        if (link !== '#') {
          // 조회수 증가 (Firebase)
          increaseViews(id, (newViews) => {
            // 화면에 즉시 반영
            const viewsElement = document.getElementById(`views_${id}`);
            if (viewsElement) {
              viewsElement.textContent = newViews;
            }
          });

          // PDF 파일인 경우 다운로드 확인 다이얼로그 표시
          if (link.toLowerCase().endsWith('.pdf')) {
            showDownloadConfirmDialog(id, link);
          } else {
            // 다른 파일 타입은 새 탭에서 열기
            window.open(link, '_blank');
          }
        } else {
          // 새로 작성된 글의 경우 detail 페이지로 이동
          showDetailPage(id);
        }
      }

      // Detail 페이지 표시
      function showDetailPage(id) {
        const post = boardData.find((item) => item.id === id);
        if (!post) return;

        // 조회수 증가 (Firebase)
        increaseViews(id, (newViews) => {
          // 화면의 조회수 업데이트
          const viewsElement = document.getElementById(`views_${id}`);
          if (viewsElement) {
            viewsElement.textContent = newViews;
          }

          // Detail 페이지 HTML 생성
          const detailHTML = `
            <div class="detail-overlay" id="detailOverlay">
              <div class="detail-container">
                <div class="detail-header">
                  <h2>${post.title}</h2>
                  <button class="detail-close" onclick="closeDetailPage()">&times;</button>
                </div>
                <div class="detail-meta">
                  <span class="detail-category">${post.category}</span>
                  <span class="detail-author">작성자: ${post.author}</span>
                  <span class="detail-date">등록일: ${post.date}</span>
                  <span class="detail-views">조회수: ${newViews}</span>
                </div>
                <div class="detail-content">
                  ${
                    post.content
                      ? post.content.replace(/\n/g, '<br>')
                      : '내용이 없습니다.'
                  }
                </div>
                <div class="detail-actions">
                  <button class="btn-back" onclick="closeDetailPage()">목록으로 돌아가기</button>
                </div>
              </div>
            </div>
          `;

          // 기존 detail 페이지가 있다면 제거
          const existingDetail = document.getElementById('detailOverlay');
          if (existingDetail) {
            existingDetail.remove();
          }

          // Detail 페이지 추가
          document.body.insertAdjacentHTML('beforeend', detailHTML);
        });
      }

      // Detail 페이지 닫기
      function closeDetailPage() {
        const detailOverlay = document.getElementById('detailOverlay');
        if (detailOverlay) {
          detailOverlay.remove();
        }
      }

      // ESC 키로 detail 페이지 닫기
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeDetailPage();
        }
      });

      // 초기 로드
      document.addEventListener('DOMContentLoaded', function () {
        console.log('DOM 로드됨');
        console.log('게시판 데이터:', boardData);
        console.log('필터링된 데이터:', filteredData);

        renderBoardTable(currentPage);
        renderPagination();
        setupSearchAndFilter();
        updateResultCount();

        console.log('초기화 완료');
      });

      // 검색 및 필터 이벤트 리스너 설정
      function setupSearchAndFilter() {
        const searchInput = document.getElementById('search-input');

        if (searchInput) {
          searchInput.addEventListener('input', handleSearchChange);
        }
      }

      // 현재 날짜 가져오기 (MM-DD 형식)
      function getCurrentDate() {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${month}-${day}`;
      }

      // 다운로드 확인 다이얼로그 표시
      function showDownloadConfirmDialog(id, link) {
        const fileName = link.split('/').pop();

        // 다운로드 확인 다이얼로그 HTML 생성
        const confirmHTML = `
          <div class="download-confirm-overlay" id="downloadConfirmOverlay">
            <div class="download-confirm-container">
              <div class="download-confirm-header">
                <h3>파일 다운로드</h3>
                <button class="download-confirm-close" onclick="closeDownloadConfirm()">&times;</button>
              </div>
              <div class="download-confirm-content">
                <p><strong>"${fileName}"</strong> 파일을 다운로드하시겠습니까?</p>
                <div class="download-confirm-actions">
                  <button class="btn-download-yes" onclick="downloadFile('${link}'); closeDownloadConfirm();">예, 다운로드</button>
                  <button class="btn-download-no" onclick="closeDownloadConfirm();">아니오, 목록으로</button>
                </div>
              </div>
            </div>
          </div>
        `;

        // 기존 다이얼로그가 있다면 제거
        const existingDialog = document.getElementById(
          'downloadConfirmOverlay'
        );
        if (existingDialog) {
          existingDialog.remove();
        }

        // 다이얼로그 추가
        document.body.insertAdjacentHTML('beforeend', confirmHTML);
      }

      // 파일 다운로드 실행
      function downloadFile(link) {
        const downloadLink = document.createElement('a');
        downloadLink.href = link;
        downloadLink.download = link.split('/').pop();
        downloadLink.style.display = 'none';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      }

      // 다운로드 확인 다이얼로그 닫기
      function closeDownloadConfirm() {
        const confirmOverlay = document.getElementById(
          'downloadConfirmOverlay'
        );
        if (confirmOverlay) {
          confirmOverlay.remove();
        }
      }
    </script>
  </body>
</html>
